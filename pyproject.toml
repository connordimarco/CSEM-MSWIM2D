[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mswim2d"
version = "0.1.0"
description = "Python client for the MSWIM2D solar wind model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Connor DiMarco" },
]
keywords = [
    "solar wind", "space weather", "heliophysics", "space physics",
    "MHD", "heliosphere", "solar wind propagation", "BATSRUS",
    "planetary space weather", "MSWIM2D",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "xarray>=2022.3",
    "requests>=2.28",
    "platformdirs>=3.0",
]

[project.urls]
Homepage = "https://csem.engin.umich.edu/MSWIM2D/"
Documentation = "https://csem.engin.umich.edu/MSWIM2D/"
Repository = "https://github.com/connordimarco/CSEM-MSWIM2D"
"Bug Tracker" = "https://github.com/connordimarco/CSEM-MSWIM2D/issues"
"Related Dataset" = "https://csem.engin.umich.edu/MIDL/"

[tool.hatch.build.targets.wheel]
packages = ["mswim2d"]

[tool.pytest.ini_options]
markers = ["smoke: tests that download from the MSWIM2D web host"]
addopts = "-m 'not smoke'"

[project.optional-dependencies]
dev = ["pytest>=7"]
