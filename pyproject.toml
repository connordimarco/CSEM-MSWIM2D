[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csem-mswim2d"
version = "0.1.0"
description = "Python client for the MSWIM2D solar wind model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Connor DiMarco" },
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "xarray>=2022.3",
    "requests>=2.28",
    "platformdirs>=3.0",
]

[project.urls]
Homepage = "https://csem.engin.umich.edu/MSWIM2D/"

[tool.hatch.build.targets.wheel]
packages = ["mswim2d"]

[tool.pytest.ini_options]
markers = ["smoke: tests that download from the MSWIM2D web host"]
addopts = "-m 'not smoke'"

[project.optional-dependencies]
dev = ["pytest>=7"]
